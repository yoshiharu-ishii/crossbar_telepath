# CI: push/PRごとにバックエンド(pytest)とフロント(node --test)を回す。
#
# テストは外部に一切出ない設計(OpenAI・AWS・PostgreSQL・MinIO不要)なので、
# シークレットもサービスコンテナも要らない。外部を含む検証は合成通話の
# リプレイが担い、ローカルで行う(docs/operations.md 参照)。
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check + build
        run: npm run build
      - name: Run tests
        run: npm test
