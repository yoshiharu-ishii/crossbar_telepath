<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>crossbar_telepath — リアルタイム識字</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --line: #e3e3df;
    --fg: #1d1d1b; --muted: #6f6f68;
    --customer: #b3261e; --customer-bg: #fdecea;
    --agent: #0f6e56; --agent-bg: #e6f4ef;
    --accent: #185fa5; --live: #2e9e5b; --select: #eef4fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #202024; --line: #33333a;
      --fg: #ececea; --muted: #9a9a94;
      --customer: #f09595; --customer-bg: #3a2020;
      --agent: #7fd0b4; --agent-bg: #16302a;
      --accent: #85b7eb; --live: #4cc07c; --select: #232c38;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    line-height: 1.6; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: none;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #status { font-size: 13px; color: var(--muted); }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  #layout { display: flex; flex: 1; min-height: 0; }
  aside {
    width: 300px; flex: none; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .side-head {
    font-size: 12px; color: var(--muted); padding: 10px 16px 4px;
    position: sticky; top: 0; background: var(--panel);
  }
  .item {
    padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .item:hover { background: var(--select); }
  .item.selected { background: var(--select); box-shadow: inset 3px 0 0 var(--accent); }
  .item .line1 { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(46,158,91,.2); }
  .item .num { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; margin-top: 2px; }
  #list-empty { padding: 24px 16px; font-size: 13px; color: var(--muted); }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #call-head {
    padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    font-size: 13px; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    flex: none;
  }
  #feed { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .row { display: flex; margin: 8px 0; }
  .row.agent { justify-content: flex-end; }
  .bubble { max-width: 72%; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .row.customer .bubble { background: var(--customer-bg); border-bottom-left-radius: 4px; }
  .row.agent .bubble { background: var(--agent-bg); border-bottom-right-radius: 4px; }
  .who { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
  .row.customer .who { color: var(--customer); }
  .row.agent .who { color: var(--agent); }
  .text { white-space: pre-wrap; word-break: break-word; }
  .bubble.pending .text { color: var(--muted); }
  .bubble.pending .text::after { content: "▌"; animation: blink 1s steps(2) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  .time { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: ui-monospace, monospace; }
  .quiet { font-size: 13px; color: var(--muted); text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<header>
  <h1>リアルタイム識字</h1>
  <span id="status">接続中…</span>
  <span class="spacer"></span>
  <button id="replay-file">録音をリプレイ</button>
</header>
<div id="layout">
  <aside>
    <div class="side-head">呼の履歴</div>
    <div id="list"></div>
    <div id="list-empty">まだ呼がありません。<br />架電するか「録音をリプレイ」。</div>
  </aside>
  <main>
    <div id="call-head"><span class="quiet" style="padding:0">呼を選択してください</span></div>
    <div id="feed"><div class="quiet">左の履歴から呼を選ぶと、ここに文字起こしが出ます。</div></div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
