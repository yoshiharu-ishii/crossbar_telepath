[project]
name = "crossbar-telepath"
version = "0.1.0"
description = "通話の両話者をチャンネル分離してリアルタイムに文字起こし・心理分析する消費サービス"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "python-dotenv>=1.0",
    "numpy>=2.1",
    "boto3>=1.35",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
