# ローカル起動: docker compose up --build (http://localhost:8000)
#   MinIOコンソール: http://localhost:9001 (既定 crossbar / crossbar-dev-secret)
#
# 本番との対応: MinIO ↔ S3、PostgreSQL ↔ Aurora PostgreSQL。
# どちらも同じAPI・同じエンジンをローカルで動かしているので、移行時に
# コードや方言の差で驚くことがない。
# 秘密(APIキー等)は backend/.env から注入し、イメージには焼かない。
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # シグナリング(SQS)を監視して実通話を拾うなら 1。リプレイだけなら 0
      WATCH_CALLS: "${WATCH_CALLS:-0}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-1}"
      # 録音の置き場。本番ではこの2つを外し、S3+IAMロールに任せる
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_BUCKET: "${S3_BUCKET:-crossbar-telepath-recordings}"
      # MinIO専用。AWS_ACCESS_KEY_ID にすると SQS/KVS も同じ鍵で認証しに行き壊れる
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-crossbar}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-crossbar-dev-secret}"
      # 呼の記録の置き場。空にするとファイル(recordings/calls/*.json)で動く
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-crossbar}:${POSTGRES_PASSWORD:-crossbar-dev-secret}@db:5432/${POSTGRES_DB:-crossbar}"
    volumes:
      # リプレイ用の録音を読む。DB/MinIO運用ではここに新しく増えることはない
      - ./recordings:/app/recordings
      # KVSやSQSを叩くときはホストのAWS認証情報を借りる
      # (S3だけは上のMINIO資格情報が優先される)
      - ~/.aws:/root/.aws:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-crossbar}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-crossbar-dev-secret}"
      POSTGRES_DB: "${POSTGRES_DB:-crossbar}"
    ports:
      # ホストの5432と衝突しないようずらす
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossbar} -d ${POSTGRES_DB:-crossbar}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-crossbar}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-crossbar-dev-secret}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # バケットを作るだけの使い捨てコンテナ(作成済みなら何もしない)
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-crossbar}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-crossbar-dev-secret}"
      S3_BUCKET: "${S3_BUCKET:-crossbar-telepath-recordings}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'bucket ready: '$$S3_BUCKET
      "

volumes:
  minio-data:
  db-data:
